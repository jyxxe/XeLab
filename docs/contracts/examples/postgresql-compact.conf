# Include from a dedicated PostgreSQL 16+ cluster's postgresql.conf, then restart.
# A starting budget for XeLab compact, not a hard cap or a measured guarantee.
# Keep data, WAL and logs on persistent storage; use local socket/loopback + pg_hba.
max_connections = 24
superuser_reserved_connections = 3
shared_buffers = '16MB'
work_mem = '1MB'
maintenance_work_mem = '16MB'
autovacuum_work_mem = '16MB'
autovacuum_max_workers = 1
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0
max_parallel_workers = 0
jit = off
# Preserve transaction/crash durability. Do not trade correctness for footprint.
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica
