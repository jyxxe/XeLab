name: Kernel M1
on:
  push:
    branches: ["main", "feat/kernel-m1"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xelab
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: xelab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xelab -d xelab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      XELAB_TEST_DATABASE_URL: "host=127.0.0.1 port=5432 user=xelab password=test-only-password dbname=xelab_test"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --all
      - name: Compile and test
        run: cargo test --workspace --all-targets
      - name: Build reference plugin
        run: cargo build --workspace --bins
      - name: Prepare real OCI test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables
          sudo systemctl start containerd
          sudo ctr namespaces create xelab-ci
          python3 examples/echo/build_artifact.py --publisher-id 00000000-0000-4000-8000-000000000001
          docker build -t docker.io/xelab-ci/echo:test -f examples/echo/Dockerfile .
          docker save docker.io/xelab-ci/echo:test -o examples/generated/echo.tar
          sudo ctr -n xelab-ci images import examples/generated/echo.tar
          digest=$(sudo ctr -n xelab-ci images list | awk '$1=="docker.io/xelab-ci/echo:test" {print $3}')
          test -n "$digest"
          sudo ctr -n xelab-ci images tag docker.io/xelab-ci/echo:test "docker.io/xelab-ci/echo@$digest"
          echo "XELAB_TEST_IMAGE=docker.io/xelab-ci/echo@$digest" >> "$GITHUB_ENV"
      - name: Real OCI API lifecycle and recovery
        env:
          XELAB_OCI_TEST: "1"
        run: |
          python3 - <<'PYTEST'
          import glob, os, subprocess
          binaries=[p for p in glob.glob("target/debug/deps/oci-*") if os.path.isfile(p) and os.access(p,os.X_OK)]
          assert len(binaries)==1,binaries
          subprocess.run(["sudo","--preserve-env=XELAB_TEST_DATABASE_URL,XELAB_TEST_IMAGE,XELAB_OCI_TEST",binaries[0],"--ignored","--nocapture"],check=True)
          PYTEST
      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check formatting diff
        if: always()
        run: |
          python3 - <<'PYFORMAT'
          import json,pathlib,base64,subprocess
          files=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
          print("XELAB_FORMATTED_BEGIN")
          print(json.dumps({p:base64.b64encode(pathlib.Path(p).read_bytes()).decode() for p in files if p.endswith(".rs")}))
          print("XELAB_FORMATTED_END")
          PYFORMAT
          git diff --quiet
      - name: Lockfile for review
        if: always()
        run: |
          if test -f Cargo.lock; then
            echo XELAB_LOCKFILE_BEGIN
            base64 -w0 Cargo.lock
            echo
            echo XELAB_LOCKFILE_END
          fi

