name: Kernel M1
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xelab
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: xelab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xelab -d xelab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      XELAB_TEST_DATABASE_URL: "host=127.0.0.1 port=5432 user=xelab password=test-only-password dbname=xelab_test"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Host acceptance tooling tests
        run: python3 -m unittest discover -s tools/acceptance -p 'test_*.py' -v
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Start isolated backup object store
        run: bash tools/start-test-s3.sh
      - name: Compile all test targets
        run: cargo test --workspace --all-targets --no-run --locked
      - name: Build reference plugin
        run: cargo build --workspace --bins --locked
      - name: Prepare real OCI test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables xfsprogs
          sudo systemctl start containerd
          sudo ctr namespaces create xelab-ci
          python3 examples/echo/build_artifact.py --publisher-id 00000000-0000-4000-8000-000000000001
          docker build -t docker.io/xelab-ci/echo:test -f examples/echo/Dockerfile .
          docker save docker.io/xelab-ci/echo:test -o examples/generated/echo.tar
          sudo ctr -n xelab-ci images import examples/generated/echo.tar
          digest=$(sudo ctr -n xelab-ci images list | awk '$1=="docker.io/xelab-ci/echo:test" {print $3}')
          test -n "$digest"
          sudo ctr -n xelab-ci images tag docker.io/xelab-ci/echo:test "docker.io/xelab-ci/echo@$digest"
          echo "XELAB_TEST_IMAGE=docker.io/xelab-ci/echo@$digest" >> "$GITHUB_ENV"
          for variant in upgrade failed-upgrade; do
            flags=(--plugin-version 2.0.0)
            variable=XELAB_TEST_UPGRADE_IMAGE
            if [[ $variant == failed-upgrade ]]; then
              flags=(--plugin-version 3.0.0 --failed-startup)
              variable=XELAB_TEST_FAILED_UPGRADE_IMAGE
            fi
            python3 examples/echo/build_artifact.py --publisher-id 00000000-0000-4000-8000-000000000001 --output "examples/generated-$variant" "${flags[@]}"
            docker build -t "docker.io/xelab-ci/$variant:test" --build-arg "ARTIFACT_DIR=examples/generated-$variant" -f examples/echo/Dockerfile .
            docker save "docker.io/xelab-ci/$variant:test" -o "examples/generated-$variant/image.tar"
            sudo ctr -n xelab-ci images import "examples/generated-$variant/image.tar"
            digest=$(sudo ctr -n xelab-ci images list | awk -v image="docker.io/xelab-ci/$variant:test" '$1==image {print $3}')
            test -n "$digest"
            sudo ctr -n xelab-ci images tag "docker.io/xelab-ci/$variant:test" "docker.io/xelab-ci/$variant@$digest"
            echo "$variable=docker.io/xelab-ci/$variant@$digest" >> "$GITHUB_ENV"
          done
          python3 examples/echo/build_artifact.py --publisher-id 00000000-0000-4000-8000-000000000001 --output examples/generated-python --implementation python --request-secret
          docker build -t docker.io/xelab-ci/echo-python:test -f examples/echo-python/Dockerfile .
          docker save docker.io/xelab-ci/echo-python:test -o examples/generated-python/echo.tar
          sudo ctr -n xelab-ci images import examples/generated-python/echo.tar
          digest=$(sudo ctr -n xelab-ci images list | awk '$1=="docker.io/xelab-ci/echo-python:test" {print $3}')
          test -n "$digest"
          sudo ctr -n xelab-ci images tag docker.io/xelab-ci/echo-python:test "docker.io/xelab-ci/echo-python@$digest"
          echo "XELAB_TEST_PYTHON_IMAGE=docker.io/xelab-ci/echo-python@$digest" >> "$GITHUB_ENV"
          python3 examples/echo/build_artifact.py --publisher-id 00000000-0000-4000-8000-000000000001 --output examples/generated-volume --implementation python --volume-access rw
          docker build -t docker.io/xelab-ci/volume:test --build-arg ARTIFACT_DIR=examples/generated-volume -f examples/echo-python/Dockerfile .
          docker save docker.io/xelab-ci/volume:test -o examples/generated-volume/volume.tar
          sudo ctr -n xelab-ci images import examples/generated-volume/volume.tar
          digest=$(sudo ctr -n xelab-ci images list | awk '$1=="docker.io/xelab-ci/volume:test" {print $3}')
          test -n "$digest"
          sudo ctr -n xelab-ci images tag docker.io/xelab-ci/volume:test "docker.io/xelab-ci/volume@$digest"
          echo "XELAB_TEST_VOLUME_IMAGE=docker.io/xelab-ci/volume@$digest" >> "$GITHUB_ENV"
          python3 examples/echo/build_artifact.py --publisher-id 00000000-0000-4000-8000-000000000001 --output examples/generated-schema --implementation python --volume-access rw --data-schema 1
          docker build -t docker.io/xelab-ci/schema:test --build-arg ARTIFACT_DIR=examples/generated-schema -f examples/echo-python/Dockerfile .
          docker save docker.io/xelab-ci/schema:test -o examples/generated-schema/schema.tar
          sudo ctr -n xelab-ci images import examples/generated-schema/schema.tar
          digest=$(sudo ctr -n xelab-ci images list | awk '$1=="docker.io/xelab-ci/schema:test" {print $3}')
          test -n "$digest"
          sudo ctr -n xelab-ci images tag docker.io/xelab-ci/schema:test "docker.io/xelab-ci/schema@$digest"
          echo "XELAB_TEST_SCHEMA_IMAGE=docker.io/xelab-ci/schema@$digest" >> "$GITHUB_ENV"
          for schema in 1 2; do
            version="${schema}.0.0"
            python3 examples/echo/build_artifact.py --publisher-id 00000000-0000-4000-8000-000000000001 --output "examples/generated-platform-schema-$schema" --implementation python --volume-access rw --data-schema "$schema" --plugin-version "$version"
            docker build -t "docker.io/xelab-ci/platform-schema-$schema:test" --build-arg "ARTIFACT_DIR=examples/generated-platform-schema-$schema" -f examples/echo-python/Dockerfile .
            docker save "docker.io/xelab-ci/platform-schema-$schema:test" -o "examples/generated-platform-schema-$schema/image.tar"
            sudo ctr -n xelab-ci images import "examples/generated-platform-schema-$schema/image.tar"
            digest=$(sudo ctr -n xelab-ci images list | awk -v name="docker.io/xelab-ci/platform-schema-$schema:test" '$1==name {print $3}')
            test -n "$digest"
            sudo ctr -n xelab-ci images tag "docker.io/xelab-ci/platform-schema-$schema:test" "docker.io/xelab-ci/platform-schema-$schema@$digest"
            echo "XELAB_TEST_PLATFORM_SCHEMA_${schema}_IMAGE=docker.io/xelab-ci/platform-schema-$schema@$digest" >> "$GITHUB_ENV"
          done
          python3 examples/echo/build_artifact.py --publisher-id 00000000-0000-4000-8000-000000000001 --output examples/generated-schema-crash --implementation python --volume-access rw --data-schema 1 --migration-pause-after-initialize
          docker build -t docker.io/xelab-ci/schema-crash:test --build-arg ARTIFACT_DIR=examples/generated-schema-crash -f examples/echo-python/Dockerfile .
          docker save docker.io/xelab-ci/schema-crash:test -o examples/generated-schema-crash/image.tar
          sudo ctr -n xelab-ci images import examples/generated-schema-crash/image.tar
          digest=$(sudo ctr -n xelab-ci images list | awk '$1=="docker.io/xelab-ci/schema-crash:test" {print $3}')
          test -n "$digest"
          sudo ctr -n xelab-ci images tag docker.io/xelab-ci/schema-crash:test "docker.io/xelab-ci/schema-crash@$digest"
          echo "XELAB_TEST_SCHEMA_CRASH_IMAGE=docker.io/xelab-ci/schema-crash@$digest" >> "$GITHUB_ENV"
          python3 examples/echo/build_artifact.py --publisher-id 00000000-0000-4000-8000-000000000001 --output examples/generated-schema-upgrade --implementation python --volume-access rw --data-schema 1 --plugin-version 2.0.0
          docker build -t docker.io/xelab-ci/schema-upgrade:test --build-arg ARTIFACT_DIR=examples/generated-schema-upgrade -f examples/echo-python/Dockerfile .
          docker save docker.io/xelab-ci/schema-upgrade:test -o examples/generated-schema-upgrade/schema.tar
          sudo ctr -n xelab-ci images import examples/generated-schema-upgrade/schema.tar
          digest=$(sudo ctr -n xelab-ci images list | awk '$1=="docker.io/xelab-ci/schema-upgrade:test" {print $3}')
          test -n "$digest"
          sudo ctr -n xelab-ci images tag docker.io/xelab-ci/schema-upgrade:test "docker.io/xelab-ci/schema-upgrade@$digest"
          echo "XELAB_TEST_SCHEMA_UPGRADE_IMAGE=docker.io/xelab-ci/schema-upgrade@$digest" >> "$GITHUB_ENV"
          python3 examples/echo/build_artifact.py --publisher-id 00000000-0000-4000-8000-000000000001 --output examples/generated-schema-transition --implementation python --volume-access rw --data-schema 2 --plugin-version 3.0.0
          docker build -t docker.io/xelab-ci/schema-transition:test --build-arg ARTIFACT_DIR=examples/generated-schema-transition -f examples/echo-python/Dockerfile .
          docker save docker.io/xelab-ci/schema-transition:test -o examples/generated-schema-transition/schema.tar
          sudo ctr -n xelab-ci images import examples/generated-schema-transition/schema.tar
          digest=$(sudo ctr -n xelab-ci images list | awk '$1=="docker.io/xelab-ci/schema-transition:test" {print $3}')
          test -n "$digest"
          sudo ctr -n xelab-ci images tag docker.io/xelab-ci/schema-transition:test "docker.io/xelab-ci/schema-transition@$digest"
          echo "XELAB_TEST_SCHEMA_TRANSITION_IMAGE=docker.io/xelab-ci/schema-transition@$digest" >> "$GITHUB_ENV"
          for variant in volume-upgrade volume-failed-upgrade; do
            flags=(--plugin-version 2.0.0)
            variable=XELAB_TEST_VOLUME_UPGRADE_IMAGE
            if [[ $variant == volume-failed-upgrade ]]; then
              flags=(--plugin-version 3.0.0 --failed-startup)
              variable=XELAB_TEST_VOLUME_FAILED_UPGRADE_IMAGE
            fi
            python3 examples/echo/build_artifact.py --publisher-id 00000000-0000-4000-8000-000000000001 --output "examples/generated-$variant" --implementation python --volume-access rw "${flags[@]}"
            docker build -t "docker.io/xelab-ci/$variant:test" --build-arg "ARTIFACT_DIR=examples/generated-$variant" -f examples/echo-python/Dockerfile .
            docker save "docker.io/xelab-ci/$variant:test" -o "examples/generated-$variant/image.tar"
            sudo ctr -n xelab-ci images import "examples/generated-$variant/image.tar"
            digest=$(sudo ctr -n xelab-ci images list | awk -v image="docker.io/xelab-ci/$variant:test" '$1==image {print $3}')
            test -n "$digest"
            sudo ctr -n xelab-ci images tag "docker.io/xelab-ci/$variant:test" "docker.io/xelab-ci/$variant@$digest"
            echo "$variable=docker.io/xelab-ci/$variant@$digest" >> "$GITHUB_ENV"
          done
          python3 examples/echo/build_artifact.py --publisher-id 00000000-0000-4000-8000-000000000001 --output examples/generated-host-blob --implementation python --request-blob
          docker build -t docker.io/xelab-ci/host-blob:test --build-arg ARTIFACT_DIR=examples/generated-host-blob -f examples/echo-python/Dockerfile .
          docker save docker.io/xelab-ci/host-blob:test -o examples/generated-host-blob/host-blob.tar
          sudo ctr -n xelab-ci images import examples/generated-host-blob/host-blob.tar
          digest=$(sudo ctr -n xelab-ci images list | awk '$1=="docker.io/xelab-ci/host-blob:test" {print $3}')
          test -n "$digest"
          sudo ctr -n xelab-ci images tag docker.io/xelab-ci/host-blob:test "docker.io/xelab-ci/host-blob@$digest"
          echo "XELAB_TEST_HOST_BLOB_IMAGE=docker.io/xelab-ci/host-blob@$digest" >> "$GITHUB_ENV"
          python3 examples/http/build_artifact.py --publisher-id 00000000-0000-4000-8000-000000000001
          docker build -t docker.io/xelab-ci/http:test -f examples/http/Dockerfile .
          python3 examples/http/container_probe.py --image docker.io/xelab-ci/http:test
          docker save docker.io/xelab-ci/http:test -o examples/http/generated/http.tar
          sudo ctr -n xelab-ci images import examples/http/generated/http.tar
          digest=$(sudo ctr -n xelab-ci images list | awk '$1=="docker.io/xelab-ci/http:test" {print $3}')
          test -n "$digest"
          sudo ctr -n xelab-ci images tag docker.io/xelab-ci/http:test "docker.io/xelab-ci/http@$digest"
          echo "XELAB_TEST_HTTP_IMAGE=docker.io/xelab-ci/http@$digest" >> "$GITHUB_ENV"
          python3 examples/http/build_artifact.py --publisher-id 00000000-0000-4000-8000-000000000001 --output examples/http/generated-mixed --plugin-version 2.0.0 --include-rpc
          docker build -t docker.io/xelab-ci/http-mixed:test --build-arg ARTIFACT_DIR=examples/http/generated-mixed -f examples/http/Dockerfile .
          python3 examples/http/container_probe.py --image docker.io/xelab-ci/http-mixed:test
          docker save docker.io/xelab-ci/http-mixed:test -o examples/http/generated-mixed/http.tar
          sudo ctr -n xelab-ci images import examples/http/generated-mixed/http.tar
          digest=$(sudo ctr -n xelab-ci images list | awk '$1=="docker.io/xelab-ci/http-mixed:test" {print $3}')
          test -n "$digest"
          sudo ctr -n xelab-ci images tag docker.io/xelab-ci/http-mixed:test "docker.io/xelab-ci/http-mixed@$digest"
          echo "XELAB_TEST_HTTP_MIXED_IMAGE=docker.io/xelab-ci/http-mixed@$digest" >> "$GITHUB_ENV"
      - name: Release imported OCI transport archives
        run: |
          python3 - <<'PY'
          import os, pathlib, re, stat, subprocess
          # Each transport was consumed by a successful ctr import and immutable
          # tag in the preceding step. All following tests read containerd CAS
          # or their own newly exported archives, never these docker-save files.
          transports = [
              ("generated", "echo.tar", "XELAB_TEST_IMAGE"),
              ("generated-upgrade", "image.tar", "XELAB_TEST_UPGRADE_IMAGE"),
              ("generated-failed-upgrade", "image.tar", "XELAB_TEST_FAILED_UPGRADE_IMAGE"),
              ("generated-python", "echo.tar", "XELAB_TEST_PYTHON_IMAGE"),
              ("generated-volume", "volume.tar", "XELAB_TEST_VOLUME_IMAGE"),
              ("generated-schema", "schema.tar", "XELAB_TEST_SCHEMA_IMAGE"),
              ("generated-platform-schema-1", "image.tar", "XELAB_TEST_PLATFORM_SCHEMA_1_IMAGE"),
              ("generated-platform-schema-2", "image.tar", "XELAB_TEST_PLATFORM_SCHEMA_2_IMAGE"),
              ("generated-schema-crash", "image.tar", "XELAB_TEST_SCHEMA_CRASH_IMAGE"),
              ("generated-schema-upgrade", "schema.tar", "XELAB_TEST_SCHEMA_UPGRADE_IMAGE"),
              ("generated-schema-transition", "schema.tar", "XELAB_TEST_SCHEMA_TRANSITION_IMAGE"),
              ("generated-volume-upgrade", "image.tar", "XELAB_TEST_VOLUME_UPGRADE_IMAGE"),
              ("generated-volume-failed-upgrade", "image.tar", "XELAB_TEST_VOLUME_FAILED_UPGRADE_IMAGE"),
              ("generated-host-blob", "host-blob.tar", "XELAB_TEST_HOST_BLOB_IMAGE"),
              (("http", "generated"), "http.tar", "XELAB_TEST_HTTP_IMAGE"),
              (("http", "generated-mixed"), "http.tar", "XELAB_TEST_HTTP_MIXED_IMAGE"),
          ]
          imported = set(subprocess.check_output(["sudo", "ctr", "-n", "xelab-ci", "images", "list", "--quiet"], text=True).splitlines())
          for _, _, variable in transports:
              image = os.environ[variable]
              assert re.fullmatch(r"docker\.io/xelab-ci/[a-z0-9-]+@sha256:[a-f0-9]{64}", image), variable
              assert image in imported, f"immutable imported image missing: {variable}"
          before = os.statvfs(".")
          released = 0
          root = os.open("examples", os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          try:
              for directory, filename, variable in transports:
                  components = (directory,) if isinstance(directory, str) else directory
                  assert all(part and part not in (".", "..") and "/" not in part for part in components)
                  parent = os.dup(root)
                  try:
                      # Resolve each fixed component beneath the opened root;
                      # nested HTTP paths cannot traverse an intermediate link.
                      for component in components:
                          child = os.open(component, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=parent)
                          os.close(parent)
                          parent = child
                      info = os.stat(filename, dir_fd=parent, follow_symlinks=False)
                      assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1, (directory, filename)
                      os.unlink(filename, dir_fd=parent)
                      os.fsync(parent)
                      released += info.st_size
                      print(f"Released consumed transport: {'/'.join(components)}/{filename}, bytes={info.st_size}")
                  finally:
                      os.close(parent)
          finally:
              os.close(root)
          after = os.statvfs(".")
          print(f"OCI transport bytes released={released}; available_before={before.f_bavail * before.f_frsize}; available_after={after.f_bavail * after.f_frsize}")
          # No containerd content, RuntimeImageIndex, signed manifest/contract,
          # runtime root, Docker image, or unrelated generated file is removed.
          PY
      # Validate new archive/import behavior before the longer controller sweep.
      # The source daemon is read only; a second daemon owns a fresh content root.
      - name: Real OCI archive and cold content-store recovery
        run: |
          python3 - <<'PYTEST'
          import glob, os, subprocess
          binaries=[p for p in glob.glob("target/debug/deps/image_archive-*") if os.path.isfile(p) and os.access(p,os.X_OK)]
          assert len(binaries)==1,binaries
          subprocess.run(["sudo","--preserve-env=XELAB_TEST_IMAGE,XELAB_TEST_PYTHON_IMAGE","env","XELAB_IMAGE_ARCHIVE_TEST=1",binaries[0],"--ignored","--nocapture"],check=True)
          PYTEST
      - name: Real signed HTTP and static OCI gateway
        env:
          XELAB_HTTP_OCI_TEST: "1"
        run: |
          python3 - <<'PYTEST'
          import glob, os, subprocess
          binaries=[p for p in glob.glob("target/debug/deps/http-*") if os.path.isfile(p) and os.access(p,os.X_OK)]
          assert len(binaries)==1,binaries
          subprocess.run(["sudo","--preserve-env=XELAB_TEST_DATABASE_URL,XELAB_TEST_HTTP_IMAGE,XELAB_TEST_HTTP_MIXED_IMAGE,XELAB_HTTP_OCI_TEST",binaries[0],"--ignored","--nocapture"],check=True)
          PYTEST
      - name: Real OCI API lifecycle and recovery
        env:
          XELAB_OCI_TEST: "1"
          XELAB_PLATFORM_SOURCE_RECEIPT: ${{ runner.temp }}/xelab-platform-source.json
        run: |
          python3 - <<'PYTEST'
          import glob, os, subprocess
          binaries=[p for p in glob.glob("target/debug/deps/oci-*") if os.path.isfile(p) and os.access(p,os.X_OK)]
          assert len(binaries)==1,binaries
          subprocess.run(["sudo","--preserve-env=XELAB_TEST_PLATFORM_SCHEMA_1_IMAGE,XELAB_TEST_PLATFORM_SCHEMA_2_IMAGE,XELAB_TEST_DATABASE_URL,XELAB_TEST_IMAGE,XELAB_TEST_UPGRADE_IMAGE,XELAB_TEST_FAILED_UPGRADE_IMAGE,XELAB_TEST_PYTHON_IMAGE,XELAB_TEST_HOST_BLOB_IMAGE,XELAB_TEST_S3_ENDPOINT,XELAB_PLATFORM_SOURCE_RECEIPT,XELAB_OCI_TEST",binaries[0],"--ignored","--nocapture"],check=True)
          PYTEST
      - name: Real XFS quota, volume lifecycle and private restore
        env:
          XELAB_PLATFORM_SOURCE_RECEIPT: ${{ runner.temp }}/xelab-platform-source.json
        run: |
          python3 - <<'PYTEST'
          import glob, os, subprocess
          binaries=[p for p in glob.glob("target/debug/deps/xfs-*") if os.path.isfile(p) and os.access(p,os.X_OK)]
          assert len(binaries)==1,binaries
          volumes=[p for p in glob.glob("target/debug/deps/volumes-*") if os.path.isfile(p) and os.access(p,os.X_OK)]
          assert len(volumes)==1,volumes
          libraries=[p for p in glob.glob("target/debug/deps/xelab_kernel-*") if os.path.isfile(p) and os.access(p,os.X_OK)]
          assert len(libraries)==1,libraries
          subprocess.run(["sudo","--preserve-env=XELAB_TEST_PLATFORM_SCHEMA_1_IMAGE,XELAB_TEST_PLATFORM_SCHEMA_2_IMAGE,XELAB_TEST_DATABASE_URL,XELAB_TEST_VOLUME_IMAGE,XELAB_TEST_VOLUME_UPGRADE_IMAGE,XELAB_TEST_VOLUME_FAILED_UPGRADE_IMAGE,XELAB_TEST_SCHEMA_IMAGE,XELAB_TEST_SCHEMA_UPGRADE_IMAGE,XELAB_TEST_SCHEMA_TRANSITION_IMAGE,XELAB_TEST_SCHEMA_CRASH_IMAGE,XELAB_TEST_S3_ENDPOINT,XELAB_PLATFORM_SOURCE_RECEIPT","env","XELAB_XFS_TEST=1","bash","tools/test-xfs.sh","--isolated-test-host",binaries[0],volumes[0],libraries[0]],check=True)
          PYTEST
      - name: Full workspace regression
        # Preserve each scenario's internal concurrency, without independent
        # Argon/policy fixtures competing with signed deadline assertions.
        run: cargo test --workspace --all-targets --locked -- --test-threads=1
      - name: Strict documentation validation
        run: |
          python3 -m venv /tmp/xelab-docs
          /tmp/xelab-docs/bin/pip install -r docs/tools/requirements.txt
          /tmp/xelab-docs/bin/python docs/tools/validate_docs.py --strict
      - name: Reference business migration files and mTLS protocol
        run: |
          migration_reference_root=$(mktemp -d "${RUNNER_TEMP}/xelab-migration-proto.XXXXXXXX")
          trap 'rm -rf -- "$migration_reference_root"' EXIT
          /tmp/xelab-docs/bin/python -m grpc_tools.protoc -I docs/contracts/proto --python_out="$migration_reference_root" --grpc_python_out="$migration_reference_root" docs/contracts/proto/xelab/v1/common.proto docs/contracts/proto/xelab/v1/lifecycle.proto docs/contracts/proto/xelab/v1/capability.proto docs/contracts/proto/xelab/v1/host.proto docs/contracts/proto/xelab/v1/migration.proto
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$migration_reference_root:examples/echo-python" /tmp/xelab-docs/bin/python -m unittest discover -s examples/echo-python -p 'test_migration_*.py' -v
      - name: Lints
        if: always()
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify tracked files remain unchanged
        if: always()
        run: git diff --exit-code

